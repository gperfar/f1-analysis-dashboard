name: Build data and deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    # Every 4 hours: picks up new sessions and keeps back-filling older ones.
    - cron: '17 */4 * * *'
  workflow_dispatch:
    inputs:
      budget_minutes:
        description: Minutes to spend downloading session data
        default: '5'

permissions:
  contents: write # push pre-computed data to the `data` branch
  pages: write
  id-token: write

# One run at a time; a newer run waits instead of cancelling a deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Pre-computed stories live on a separate `data` branch so they
      # accumulate across runs without bloating `main`.
      - name: Check out data branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin data > /dev/null; then
            git clone --depth 1 --branch data "$REPO_URL" public/data
          else
            mkdir -p public/data
            cd public/data
            git init -b data
            git remote add origin "$REPO_URL"
          fi

      # OpenF1 responses, so retries and re-runs don't download them again.
      - uses: actions/cache@v4
        with:
          path: .openf1-cache
          key: openf1-${{ github.run_id }}
          restore-keys: openf1-

      - name: Build session data
        env:
          # Optional: set this repository secret to add AI-written recaps.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Optional: lets the build find highlight videos of older sessions.
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        # Pushes publish quickly (5 minutes is enough for anything new);
        # scheduled runs spend 45 minutes back-filling older sessions.
        run: npx tsx scripts/build-data.ts --out public/data --budget-minutes ${{ inputs.budget_minutes || (github.event_name == 'schedule' && '45' || '5') }}

      - name: Save data branch
        run: |
          cd public/data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new data"
          else
            git commit -q -m "Update session data"
            git push -q origin data
          fi

      - run: npm run build

      - name: Drop git metadata from the site
        run: rm -rf dist/data/.git

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
